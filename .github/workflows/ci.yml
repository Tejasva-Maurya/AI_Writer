# Lint and tests on every push and pull request (KI-025, decision D-013).
# Same commands as locally: see docs/technical/07-setup-and-usage.md, "Tests and lint".
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r app/requirements-dev.txt
      - name: Lint
        run: python -m ruff check app
      - name: Tests
        run: python -m pytest app/tests
      - name: Frontend syntax
        run: node --check app/frontend/app.js
